[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "looker-studio-to-powerbi"
version = "1.0.0"
description = "Automated migration of Looker Studio reports to Power BI .pbip projects (PBIR v4.0 + TMDL)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Looker Studio to Power BI Migration Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["looker-studio", "powerbi", "migration", "pbip", "tmdl", "pbir", "dax", "google-analytics"]

# No external dependencies — stdlib only
dependencies = []

[project.optional-dependencies]
deploy = [
    "azure-identity>=1.15.0",
    "requests>=2.31.0",
]
google = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage>=7.0",
]
all = [
    "azure-identity>=1.15.0",
    "requests>=2.31.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage>=7.0",
]

[tool.setuptools]
packages = ["looker_import"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
